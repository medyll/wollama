name: CI

on:
    push:
        branches: ['main', 'dev']
    pull_request:
        branches: ['main', 'dev']

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Set up pnpm and Node.js
              uses: pnpm/setup@v1
              with:
                  runtime: node@22
                  cache: true

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check types
              run: pnpm check

            - name: Lint
              # The repository currently contains legacy formatting and ESLint debt.
              # Keep reporting it without blocking type checks, tests, and builds.
              continue-on-error: true
              run: pnpm lint

            - name: Run Client Unit Tests
              run: pnpm test:client -- --run

            - name: Run Server Unit Tests
              run: pnpm test:server -- --run

            - name: Build
              run: pnpm build
