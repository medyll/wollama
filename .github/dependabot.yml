# Dependency updates by Dependabot: deterministic, no LLM.
# Compatible (minor/patch) updates only, grouped into one pull request per
# ecosystem; major versions are left to a human. Dependabot never rewrites
# local specs (link:, file:, workspace:).
version: 2
updates:
    - package-ecosystem: npm
      directories:
          - '/'
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: Europe/Paris
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'chore(deps)'
      groups:
          compatible:
              patterns: ['*']
              update-types: [minor, patch]
      ignore:
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
    - package-ecosystem: pip
      directories:
          - '/packages/chatterbox'
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: Europe/Paris
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'chore(deps)'
      groups:
          compatible:
              patterns: ['*']
              update-types: [minor, patch]
      ignore:
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
