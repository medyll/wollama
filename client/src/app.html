<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: ws: http: https:;"
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Wollama</title>
		<script>
			let storedTheme = 'light';

			try {
				const storedUser = JSON.parse(localStorage.getItem('wollama_user') || '{}');
				storedTheme = storedUser?.preferences?.theme === 'dark' ? 'dark' : 'light';
			} catch {
				storedTheme = 'light';
			}

			document.documentElement.setAttribute('data-theme', storedTheme);
		</script>
		<script>
			window.Prism = window.Prism || {};
			Prism.manual = true;
		</script>
		%sveltekit.head%
	</head>
	<body class="font-normal" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
